name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  readiness:
    name: Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/setup@v2.0.2
        with:
          install: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args:
              - --frozen-lockfile

      - name: Validate readiness
        run: pnpm ready
