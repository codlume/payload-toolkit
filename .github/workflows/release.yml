name: Release

# A releasable merge prepares a release pull request. A maintainer authorizes
# publication by merging that pull request. npm's trusted publisher is bound to
# this filename; do not rename it. The repair for any failure is "Re-run failed
# jobs": every step checks the world before acting.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # Existing release PRs may predate draft-by-default configuration. Move
      # one back to draft before release-please refreshes it so a maintainer
      # cannot merge changelogs that have not been enriched yet.
      - name: Hold the open release PR as draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh api graphql -F owner="$GITHUB_REPOSITORY_OWNER" -F name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                pullRequests(states: OPEN, baseRefName: "main", labels: ["autorelease: pending"],
                             first: 2, orderBy: {field: UPDATED_AT, direction: DESC}) {
                  nodes { number isDraft }
                }
              }
            }' --jq '.data.repository.pullRequests.nodes')

          count=$(jq 'length' <<<"$prs")
          if (( count > 1 )); then
            echo "::error::Found $count open release PRs; expected at most one."
            exit 1
          fi
          if (( count == 0 )); then
            echo "No existing release PR to hold as draft."
            exit 0
          fi

          pr=$(jq -c '.[0]' <<<"$prs")
          number=$(jq -r '.number' <<<"$pr")
          if [[ "$(jq -r '.isDraft' <<<"$pr")" == "true" ]]; then
            echo "Release PR #$number is already a draft."
          else
            gh pr ready "$number" --repo "$GITHUB_REPOSITORY" --undo
          fi

      # No checkout: release-please works through the API. Ordinary merges open
      # or update a release PR and then this run has nothing left to publish. If
      # a maintainer merged that PR, release-please logs "untagged, merged release
      # PRs outstanding" and opens nothing; the steps below publish it.
      - name: Open or update the release PR
        id: release-pr
        uses: googleapis/release-please-action@v5.0.0
        with:
          skip-github-release: true

      # The merge commit of the newest merged release PR is the only commit the
      # rest of the job may act on. Never github.sha: a later feature merge can
      # replace the release PR's pending workflow run, and a re-run after a
      # partial failure can start from an unrelated push. A pending PR still
      # needs its GitHub Releases and its npm publish. A tagged PR needs at most
      # the npm publish, and only a re-run attempts it: release-please relabels
      # the PR when it creates the GitHub Releases, before npm publish runs, so
      # an ordinary push after a finished release finds nothing to do. GraphQL
      # avoids the search-index lag of `gh pr list --label` immediately after a
      # maintainer merges the release PR.
      - name: Find the release commit
        id: release-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api graphql -F owner="$GITHUB_REPOSITORY_OWNER" -F name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                pullRequests(states: MERGED, baseRefName: "main",
                             labels: ["autorelease: pending", "autorelease: tagged"],
                             first: 1, orderBy: {field: CREATED_AT, direction: DESC}) {
                  nodes { number mergeCommit { oid } labels(first: 20) { nodes { name } } }
                }
              }
            }' --jq '.data.repository.pullRequests.nodes[0] // empty')

          number=""
          sha=""
          pending=""
          if [[ -z "$pr" ]]; then
            echo "Nothing to release: no release PR has been merged."
          else
            number=$(jq -r '.number' <<<"$pr")
            merge_sha=$(jq -r '.mergeCommit.oid' <<<"$pr")
            if jq -e '.labels.nodes | any(.name == "autorelease: pending")' <<<"$pr" >/dev/null; then
              sha=$merge_sha
              pending=true
              echo "Release commit: $sha (release PR #$number awaits its GitHub Releases and npm publish)"
            elif (( GITHUB_RUN_ATTEMPT > 1 )); then
              sha=$merge_sha
              pending=false
              echo "Release commit: $sha (re-run; release PR #$number is tagged, publishing whatever npm still lacks)"
            else
              echo "Nothing to release: the newest release PR #$number is already tagged."
            fi
          fi
          {
            echo "number=$number"
            echo "sha=$sha"
            echo "pending=$pending"
          } >> "$GITHUB_OUTPUT"

      # The open release branch may predate this automation. Run preparation
      # from the triggering main commit; the command checks out and updates the
      # exact release PR head in an isolated temporary working copy.
      - name: Checkout release PR preparation
        if: steps.release-commit.outputs.sha == ''
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false

      - name: Set up Node for release PR preparation
        if: steps.release-commit.outputs.sha == ''
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: automation/.node-version
          package-manager-cache: false

      - name: Prepare the release PR
        if: steps.release-commit.outputs.sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/tools/release-tools/src/cli.ts prepare-pull-request

      - name: Checkout the release commit
        if: steps.release-commit.outputs.sha != ''
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release-commit.outputs.sha }}

      - name: Set up pnpm
        if: steps.release-commit.outputs.sha != ''
        uses: pnpm/setup@v2.0.2
        with:
          install: false

      - name: Set up Vite+
        if: steps.release-commit.outputs.sha != ''
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args:
              - --frozen-lockfile

      # No LocalStack: the build and pack tests make no S3 calls. A failure here
      # is deterministic (the release commit is broken), so it is fixed forward:
      # the tagging step still runs and the version becomes a Skipped version.
      - name: Build and test the release commit
        id: build
        if: steps.release-commit.outputs.sha != ''
        run: pnpm build:packages && pnpm test:build && pnpm test:pack

      # Tags and GitHub Releases come before npm: the public record of a version
      # exists before the one irreversible step, and a failed publish leaves a
      # tagged PR for the re-run to finish. A release commit that failed its own
      # build is tagged and released anyway (a Skipped version, never on npm),
      # because an untagged pending PR would make every later run re-find it and
      # fail again. A re-run of an already tagged PR skips this step: release-
      # please would find only duplicate tags and fail. paths_released is only
      # set in the run that created a Release, so it is logged and never
      # consulted for publishing.
      - name: Create tags and GitHub Releases
        id: github-release
        if: steps.release-commit.outputs.pending == 'true' && (success() || steps.build.outcome == 'failure')
        uses: googleapis/release-please-action@v5.0.0
        with:
          skip-github-pull-request: true

      # release-please exits 0 when it releases nothing, for example when the
      # merged PR's title no longer matches group-pull-request-title-pattern
      # (it refreshes only the body of an open release PR). Its relabel to
      # "autorelease: tagged" is the proof that every plugin in the release PR
      # has its tag and GitHub Release. Nothing reaches npm without it.
      - name: Verify the release PR is tagged
        id: release-tagged
        if: steps.github-release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release-commit.outputs.number }}
        run: |
          if gh pr view "$RELEASE_PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' \
               | grep -qx 'autorelease: tagged'; then
            echo "Release PR #$RELEASE_PR is tagged."
          else
            echo "::error::release-please created no GitHub Release for release PR #$RELEASE_PR; see its log above. If it reported a bad pull request title, retitle the merged PR to match group-pull-request-title-pattern in release-please-config.json, then re-run the failed jobs."
            exit 1
          fi

      # npm is the last step and runs only for a release commit that built and
      # is tagged (either in this run or, on a re-run, earlier). Each plugin
      # publishes independently; one failure does not block the other, and the
      # step fails at the end if any failed. -r is required even for one
      # package: only pnpm's recursive publish skips versions already on npm and
      # skips private packages, which is what makes a re-run safe.
      # --no-git-checks because HEAD is detached. No token: pnpm publishes with
      # OIDC (id-token: write) and attaches provenance itself.
      - name: Publish to npm
        if: steps.build.outcome == 'success' && (steps.release-commit.outputs.pending == 'false' || steps.release-tagged.outcome == 'success')
        run: |
          failed=()
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            if pnpm -r --filter "$name" publish --no-git-checks; then
              echo "Published (or already on npm): $name"
            else
              failed+=("$name")
            fi
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error::Publish failed for: ${failed[*]}"
            exit 1
          fi

      - name: Log release-please outputs
        if: always()
        env:
          PRS: ${{ steps.release-pr.outputs.prs }}
          RELEASES_CREATED: ${{ steps.github-release.outputs.releases_created }}
          PATHS_RELEASED: ${{ steps.github-release.outputs.paths_released }}
        run: |
          echo "Release PRs:        ${PRS:-none}"
          echo "Releases created:   ${RELEASES_CREATED:-none}"
          echo "Paths released:     ${PATHS_RELEASED:-none}"
